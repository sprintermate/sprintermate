name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    strategy:
      matrix:
        # Define your server labels and their corresponding paths
        include:
          - server-label: pi
            app-path: /home/berkslv/sprintermate
            compose-file: docker-compose.pi.yml
          - server-label: dt
            app-path: /home/dtpamxtribe/projects/sprintermate
            compose-file: docker-compose.dt.yml

    # This forces the job to run on BOTH servers in parallel
    runs-on: [self-hosted, "${{ matrix.server-label }}"]
    
    steps:
      - name: Pull latest changes
        working-directory: ${{ matrix.app-path }}
        run: git pull origin main

      - name: Build and restart containers
        working-directory: ${{ matrix.app-path }}
        run: |
          docker compose -f ${{ matrix.compose-file }} build --no-cache
          docker compose -f ${{ matrix.compose-file }} up -d --remove-orphans